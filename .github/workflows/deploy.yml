name: Deploy Choopy to Oracle Cloud

on:
  push:
    branches:
      - main # Die Pipeline startet automatisch, wenn du in den main-Branch pushst

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout Code
        uses: actions/checkout@v4

      # ----------------- BACKEND -----------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Backend (Maven)
        run: |
          cd backend/choopy
          ./mvnw clean package -DskipTests
          
      - name: Upload Backend jar (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          source: "backend/choopy/target/*.jar"
          target: "/home/ubuntu/"
          strip_components: 3
          
      - name: restart backend on server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            mv /home/ubuntu/*.jar /home/ubuntu/backend.jar
            sudo systemctl restart backend

      # ----------------- FRONTEND -----------------
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Frontend (Vite/React)
        run: |
          cd frontend/choopy-react
          npm ci
          npm run build
          
      - name: Upload Frontend (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/home/ubuntu/dist"
          strip_components: 2

      - name: Set nginx configuration (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/choopy/*
            sudo cp -r /home/ubuntu/dist/* /var/www/html/choopy/
            rm -rf /home/ubuntu/dist